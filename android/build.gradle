// Kept for plugin compatibility — some Flutter plugins read rootProject.ext.kotlin_version
ext.kotlin_version = '2.2.0'

allprojects {
    repositories {
        google()
        mavenCentral()
    }

    configurations.all {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'androidx.appcompat' &&
                    (details.requested.name == 'appcompat' || details.requested.name == 'appcompat-resources')) {
                details.useVersion '1.7.0'
            }
            if (details.requested.group == 'androidx.activity') {
                details.useVersion '1.10.0'
            }
        }
    }
}

rootProject.buildDir = '../build'

subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
    project.evaluationDependsOn(':app')
}

subprojects {
    if (project.name != 'app') {
        afterEvaluate {
            if (plugins.hasPlugin("com.android.application") ||
                    plugins.hasPlugin("com.android.library")) {
                android {
                    compileSdk 36
                    compileOptions {
                        sourceCompatibility JavaVersion.VERSION_17
                        targetCompatibility JavaVersion.VERSION_17
                    }
                }
            }
            tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
                kotlinOptions {
                    jvmTarget = '17'
                }
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
