<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link href="https://cdn.quilljs.com/1.3.7/quill.snow.css" rel="stylesheet">
<style>
  :root {
    --editor-bg: #ffffff;
    --editor-fg: #000000;
    --icon-color: #747474;
    --editor-link: #1c5ad6;
    --editor-placeholder: #aaa;
    --editor-border: #e0e0e0;
    --toolbar-bg: #ffffff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--editor-bg);
    color: var(--editor-fg);
    font-family: 'Noto Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-size: 14px;
    -webkit-text-size-adjust: 100%;
  }

  /* ── Toolbar: flat, compact, horizontally scrollable ── */
  #toolbar-container {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--toolbar-bg);
    border-bottom: 0.5px solid var(--editor-border);
    overflow-x: auto;
    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none; /* Firefox */
  }
  #toolbar-container::-webkit-scrollbar { display: none; }

  .ql-toolbar.ql-snow {
    border: none !important;
    padding: 2px 4px !important;
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 0;
    min-width: max-content;
  }
  .ql-toolbar .ql-formats {
    display: inline-flex;
    align-items: center;
    margin-right: 2px !important;
    vertical-align: middle;
  }
  /* Compact button sizing */
  .ql-toolbar button {
    width: 28px !important;
    height: 28px !important;
    padding: 3px !important;
  }
  .ql-toolbar .ql-picker {
    height: 28px !important;
  }
  .ql-toolbar .ql-picker-label {
    padding: 2px 4px !important;
    font-size: 12px !important;
  }
  /* Separator between format groups */
  .ql-formats + .ql-formats {
    border-left: 0.5px solid var(--editor-border);
    padding-left: 2px;
  }

  /* Icon colors */
  .ql-toolbar .ql-stroke { stroke: var(--icon-color) !important; }
  .ql-toolbar .ql-fill { fill: var(--icon-color) !important; }
  .ql-toolbar .ql-picker-label { color: var(--icon-color) !important; }
  .ql-toolbar button:hover, .ql-toolbar button.ql-active {
    color: var(--editor-link) !important;
  }
  .ql-toolbar button:hover .ql-stroke, .ql-toolbar button.ql-active .ql-stroke {
    stroke: var(--editor-link) !important;
  }
  .ql-toolbar button:hover .ql-fill, .ql-toolbar button.ql-active .ql-fill {
    fill: var(--editor-link) !important;
  }

  /* Hide Snow theme toolbar (we use Flutter toolbar instead) */
  .ql-toolbar.ql-snow { display: none !important; }
  /* ── Editor area — content expands naturally, WKWebView scrolls ── */
  .ql-container.ql-snow {
    border: none !important;
    font-family: 'Noto Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-size: 14px;
  }
  .ql-editor {
    padding: 12px;
    min-height: 200px;
    color: var(--editor-fg);
    background: var(--editor-bg);
    line-height: 1.6;
  }
  .ql-editor.ql-blank::before {
    color: var(--editor-placeholder);
    font-style: italic;
  }
  .ql-editor a { color: var(--editor-link); }
  .ql-editor img { max-width: 100% !important; height: auto !important; }
  .ql-editor blockquote {
    border-left: 3px solid var(--editor-border);
    margin: 4px 0;
    padding-left: 12px;
    color: var(--editor-fg);
  }
  /* Size picker dropdown */
  .ql-snow .ql-picker.ql-size .ql-picker-label::before { content: 'Size' !important; }
  .ql-snow .ql-picker.ql-size .ql-picker-item[data-value="small"]::before { content: 'Small'; font-size: 10px; }
  .ql-snow .ql-picker.ql-size .ql-picker-item::before { content: 'Normal'; font-size: 14px; }
  .ql-snow .ql-picker.ql-size .ql-picker-item[data-value="large"]::before { content: 'Large'; font-size: 18px; }
  .ql-snow .ql-picker.ql-size .ql-picker-item[data-value="huge"]::before { content: 'Huge'; font-size: 24px; }
  /* Hide Quill's tooltip */
  .ql-tooltip { display: none !important; }
</style>
</head>
<body>
<div id="editor"></div>

<script src="https://cdn.quilljs.com/1.3.7/quill.min.js"></script>
<script>
(function() {
  'use strict';

  var quill = new Quill('#editor', {
    theme: 'snow',
    modules: { toolbar: false },
    placeholder: 'Compose your message...'
  });

  var isDirtyFlag = false;

  function reportFormats() {
    var f = quill.getFormat();
    notifyFlutter('onActiveFormats', f);
  }

  quill.on('text-change', function() {
    isDirtyFlag = true;
    notifyFlutter('onEditorChange', quill.root.innerHTML);
    notifyHeight();
  });

  quill.on('selection-change', function(range) {
    if (range) reportFormats();
  });

  // Report scroll position to Flutter for header collapse/expand
  var lastAtTop = true;
  window.addEventListener('scroll', function() {
    var atTop = (window.scrollY || window.pageYOffset) < 5;
    if (atTop !== lastAtTop) {
      lastAtTop = atTop;
      notifyFlutter('onScrollAtTop', atTop);
    }
  });

  function notifyHeight() {
    var bodyH = document.body.scrollHeight || 0;
    var docH = document.documentElement.scrollHeight || 0;
    var editorH = document.querySelector('.ql-editor') ? document.querySelector('.ql-editor').scrollHeight : 0;
    var h = Math.max(bodyH, docH);
    console.log('[QUILL_HEIGHT] body=' + bodyH + ' doc=' + docH + ' editor=' + editorH + ' max=' + h);
    notifyFlutter('onHeightChange', h);
  }

  function notifyFlutter(handler, data) {
    if (window.flutter_inappwebview) {
      window.flutter_inappwebview.callHandler(handler, data);
    }
  }

  window.getContent = function() { return quill.root.innerHTML; };
  window.getPlainText = function() { return quill.getText().trim(); };

  window.setContent = function(html) {
    var delta = quill.clipboard.convert(html);
    quill.setContents(delta, 'silent');
    isDirtyFlag = false;
    setTimeout(notifyHeight, 100);
  };

  window.isDirty = function() { return isDirtyFlag; };
  window.clearDirty = function() { isDirtyFlag = false; };
  window.focusEditor = function() { quill.focus(); };
  window.editorUndo = function() { quill.history.undo(); };
  window.editorRedo = function() { quill.history.redo(); };
  window.applyFormat = function(fmt, val) {
    if (fmt === 'clean') { quill.removeFormat(quill.getSelection() || {index:0, length:quill.getLength()}); }
    else if (fmt === 'link') { var url = prompt('Enter URL:'); if (url) quill.format('link', url); }
    else if (fmt === 'indent') { quill.format('indent', val); }
    else if (val === false) { quill.format(fmt, false); }
    else { quill.format(fmt, val === true ? true : val); }
    reportFormats();
  };

  window.setDarkMode = function(isDark) {
    var root = document.documentElement.style;
    if (isDark) {
      root.setProperty('--editor-bg', '#121212');
      root.setProperty('--editor-fg', '#D1D5DB');
      root.setProperty('--icon-color', '#9E9E9E');
      root.setProperty('--editor-link', '#7EB3FF');
      root.setProperty('--editor-placeholder', '#666');
      root.setProperty('--editor-border', '#3A3A3A');
      root.setProperty('--toolbar-bg', '#1E1E1E');
    } else {
      root.setProperty('--editor-bg', '#ffffff');
      root.setProperty('--editor-fg', '#000000');
      root.setProperty('--icon-color', '#747474');
      root.setProperty('--editor-link', '#1c5ad6');
      root.setProperty('--editor-placeholder', '#aaa');
      root.setProperty('--editor-border', '#e0e0e0');
      root.setProperty('--toolbar-bg', '#ffffff');
    }
    document.body.style.background = isDark ? '#121212' : '#ffffff';
    document.body.style.color = isDark ? '#D1D5DB' : '#000000';
  };

  window.getContentHeight = function() {
    return Math.max(
      document.body.scrollHeight || 0,
      document.documentElement.scrollHeight || 0
    );
  };

  window.addEventListener('load', function() {
    setTimeout(function() {
      notifyHeight();
      notifyFlutter('onEditorReady');
    }, 100);
  });
})();
</script>
</body>
</html>
