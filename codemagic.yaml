          echo "PROD_START prefix: $PROD_START"
          echo "FINAL_BUILD_NUMBER: $FINAL_BUILD_NUMBER"

          cd ios && agvtool new-version -all $FINAL_BUILD_NUMBER && cd ..
          flutter build ipa \
            --flavor "$FLAVOR" \
            --release \
            --export-options-plist=ios/ExportOptions-prod.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
